          description: ''
    put:
      operationId: api_invoices_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invoice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Invoice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Invoice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: ''
    patch:
      operationId: api_invoices_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInvoice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedInvoice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInvoice'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: ''
    delete:
      operationId: api_invoices_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/settings/:
    get:
      operationId: api_settings_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
          description: ''
    put:
      operationId: api_settings_update
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSettings'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlatformSettings'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlatformSettings'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
          description: ''
    patch:
      operationId: api_settings_partial_update
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPlatformSettings'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPlatformSettings'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPlatformSettings'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
          description: ''
  /api/settings/rotate-secret/:
    post:
      operationId: api_settings_rotate_secret_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSettings'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlatformSettings'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlatformSettings'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Secret key rotation timestamp updated.
  /api/tasks/:
    get:
      operationId: api_tasks_list
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
          description: ''
    post:
      operationId: api_tasks_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Task'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Task'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/tasks/{id}/:
    get:
      operationId: api_tasks_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    put:
      operationId: api_tasks_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Task'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Task'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    patch:
      operationId: api_tasks_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTask'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTask'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTask'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    delete:
      operationId: api_tasks_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/tasks/{id}/request-completion/:
    post:
      operationId: api_tasks_request_completion_create
      description: |-
        POST /api/tasks/<id>/request-completion/

        Lets the assignee (staff) flag a task as ready for review, without
        letting them change its status directly. Logs an ActivityLog entry and
        broadcasts both the task update and the activity entry in real time so
        admins see it immediately without refreshing.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Task'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Task'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/users/:
    get:
      operationId: api_users_list
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
          description: ''
components:
  schemas:
    ActivityLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        user_name:
          type: string
          readOnly: true
        user_initials:
          type: string
          readOnly: true
        action:
          type: string
          maxLength: 255
        related_task:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_read:
          type: string
          readOnly: true
      required:
      - action
      - created_at
      - id
      - is_read
      - user
      - user_initials
      - user_name
    Booking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client:
          type: integer
          readOnly: true
        client_name:
          type: string
          readOnly: true
        service_name:
          type: string
          maxLength: 255
        scheduled_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/BookingStatusEnum'
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - client
      - client_name
      - created_at
      - id
      - scheduled_at
      - service_name
      - updated_at
    BookingStatusEnum:
      enum:
      - pending
      - confirmed
      - cancelled
      - completed
      type: string
      description: |-
        * `pending` - Pending
        * `confirmed` - Confirmed
        * `cancelled` - Cancelled
        * `completed` - Completed
    Document:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uploaded_by:
          type: integer
          readOnly: true
        uploaded_by_name:
          type: string
          readOnly: true
        assigned_to:
          type: integer
          nullable: true
        assigned_to_name:
          type: string
          readOnly: true
        assigned_to_initials:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        category:
          type: string
          maxLength: 100
        file:
          type: string
          format: uri
        file_size_mb:
          type: number
          format: double
          readOnly: true
          nullable: true
        audit_notice:
          type: string
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_to_initials
      - assigned_to_name
      - file
      - file_size_mb
      - id
      - title
      - updated_at
      - uploaded_at
      - uploaded_by
      - uploaded_by_name
    EnvironmentStageEnum:
      enum:
      - prod
      - staging
      - dev
      type: string
      description: |-
        * `prod` - Production (Live Webhooks)
        * `staging` - Staging Canary
        * `dev` - Development Sandbox
    Invoice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client:
          type: integer
          readOnly: true
        client_name:
          type: string
          readOnly: true
        booking:
          type: integer
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/InvoiceStatusEnum'
        due_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - client
      - client_name
      - created_at
      - id
      - updated_at
    InvoiceStatusEnum:
      enum:
      - draft
      - sent
      - paid
      - overdue
      type: string
      description: |-
        * `draft` - Draft
        * `sent` - Sent
        * `paid` - Paid
        * `overdue` - Overdue
    PatchedBooking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client:
          type: integer
          readOnly: true
        client_name:
          type: string
          readOnly: true
        service_name:
          type: string
          maxLength: 255
        scheduled_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/BookingStatusEnum'
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedDocument:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uploaded_by:
          type: integer
          readOnly: true
        uploaded_by_name:
          type: string
          readOnly: true
        assigned_to:
          type: integer
          nullable: true
        assigned_to_name:
          type: string
          readOnly: true
        assigned_to_initials:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        category:
          type: string
          maxLength: 100
        file:
          type: string
          format: uri
        file_size_mb:
          type: number
          format: double
          readOnly: true
          nullable: true
        audit_notice:
          type: string
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedInvoice:
      type: object
      properties:
        id:
          type: integer
